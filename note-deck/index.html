<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mrbd-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A small deck of notes for Meta Ray-Ban Display glasses." />
    <title>Note Deck</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="deck-view" aria-label="Note cards">
        <div class="deck" id="deck"></div>
        <div class="new-note-actions">
          <button class="action-button" id="new-note" type="button">＋ New note</button>
          <p class="voice-hint">While open: “Hey Meta, make a note…”</p>
        </div>
      </section>
      <p id="status" class="sr-only" role="status"></p>
    </main>

    <dialog id="note-editor" class="editor" aria-label="Edit note">
      <div class="editor-card">
        <div class="card-topline">
          <span class="card-index" id="editor-number"></span>
          <span class="card-date" id="editor-date"></span>
        </div>
        <div class="card-rule"></div>
        <label class="sr-only" for="note-text">Note text</label>
        <textarea id="note-text" name="note" maxlength="1500" autofocus aria-label="Note text"></textarea>
      </div>
      <div class="action-row editor-action-row">
        <button class="delete-button" id="delete-note" type="button" hidden>Delete card</button>
        <div class="delete-confirm" id="delete-confirm" hidden>
          <span>Delete this card?</span>
          <button class="secondary-button" id="cancel-delete" type="button">Keep</button>
          <button class="danger-button" id="confirm-delete" type="button">Delete</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
